<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سبد خرید — MahradCNC</title>
  <link rel="icon" href="img/icon.png" type="image/png">
  <link rel="stylesheet" href="css/main.css">
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/sahel-font@v3.4.0/dist/font-face.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body class="bg-bg-secondary text-text-primary min-h-screen flex flex-col">
  <div id="site-header"></div>

  <main class="flex-1 max-w-7xl mx-auto w-full px-lg md:px-3xl py-2xl md:py-3xl">
    <h1 class="text-2xl md:text-3xl font-bold text-text-primary leading-tight mb-2xl">سبد خرید و تسویه</h1>

    <div id="checkout-empty" class="hidden"></div>

    <div id="checkout-content" class="grid grid-cols-1 lg:grid-cols-3 gap-3xl hidden">
      <div class="lg:col-span-2 flex flex-col gap-lg" id="cart-lines"></div>

      <aside class="flex flex-col gap-lg">
        <div class="bg-bg-primary border border-border-light rounded-xl shadow-sm p-xl">
          <h2 class="text-lg font-semibold mb-lg">خلاصه سفارش</h2>
          <div class="flex justify-between text-sm mb-sm">
            <span class="text-text-secondary">جمع جزء</span>
            <span id="subtotal" class="font-medium">—</span>
          </div>
          <div class="flex justify-between text-sm mb-lg pb-lg border-b border-border-light">
            <span class="text-text-secondary">هزینه ارسال</span>
            <span class="text-success text-xs font-medium">محاسبه پس از ثبت</span>
          </div>
          <div class="flex justify-between text-base font-semibold mb-xl">
            <span>مبلغ قابل پرداخت</span>
            <span id="grand-total" class="text-primary">—</span>
          </div>
          <a id="wa-cart-btn" href="#" target="_blank" rel="noopener" class="w-full bg-nav text-white px-xl py-md rounded-lg font-medium text-base inline-flex items-center justify-center gap-2 hover:opacity-90">
            <i class="fa-brands fa-whatsapp" aria-hidden="true"></i> ارسال خلاصه در واتساپ
          </a>
        </div>

        <form id="checkout-form" class="bg-bg-primary border border-border-light rounded-xl shadow-sm p-xl flex flex-col gap-lg" novalidate>
          <h2 class="text-lg font-semibold">اطلاعات تحویل (B2B)</h2>
          <div class="border border-border-medium rounded-xl overflow-hidden focus-within:border-primary focus-within:shadow-focus transition-all duration-200">
            <div class="flex items-stretch">
              <label for="name" class="bg-bg-secondary border-l border-border-light min-w-[110px] px-lg py-3.5 text-sm text-text-secondary flex items-center">نام</label>
              <input id="name" name="name" required class="flex-1 px-lg py-3.5 text-base outline-none bg-transparent" autocomplete="name">
            </div>
          </div>
          <div class="border border-border-medium rounded-xl overflow-hidden focus-within:border-primary focus-within:shadow-focus transition-all duration-200">
            <div class="flex items-stretch">
              <label for="company" class="bg-bg-secondary border-l border-border-light min-w-[110px] px-lg py-3.5 text-sm text-text-secondary flex items-center">شرکت</label>
              <input id="company" name="company" class="flex-1 px-lg py-3.5 text-base outline-none bg-transparent" autocomplete="organization">
            </div>
          </div>
          <div class="border border-border-medium rounded-xl overflow-hidden focus-within:border-primary focus-within:shadow-focus transition-all duration-200">
            <div class="flex items-stretch">
              <label for="economicCode" class="bg-bg-secondary border-l border-border-light min-w-[110px] px-lg py-3.5 text-sm text-text-secondary flex items-center">کد اقتصادی</label>
              <input id="economicCode" name="economicCode" class="flex-1 px-lg py-3.5 text-base outline-none bg-transparent" placeholder="اختیاری">
            </div>
          </div>
          <div class="border border-border-medium rounded-xl overflow-hidden focus-within:border-primary focus-within:shadow-focus transition-all duration-200">
            <div class="flex items-stretch">
              <label for="phone" class="bg-bg-secondary border-l border-border-light min-w-[110px] px-lg py-3.5 text-sm text-text-secondary flex items-center">موبایل</label>
              <input id="phone" name="phone" type="tel" required pattern="09[0-9]{9}" placeholder="09xxxxxxxxx" class="flex-1 px-lg py-3.5 text-base outline-none bg-transparent" autocomplete="tel">
            </div>
          </div>
          <p id="phone-error" class="text-xs text-danger hidden -mt-sm">شماره موبایل باید ۱۱ رقم و با ۰۹ شروع شود.</p>
          <div class="border border-border-medium rounded-xl overflow-hidden focus-within:border-primary focus-within:shadow-focus transition-all duration-200">
            <label for="address" class="sr-only">آدرس</label>
            <textarea id="address" name="address" rows="3" required placeholder="آدرس کامل تحویل" class="w-full px-lg py-3.5 text-base outline-none bg-transparent resize-y leading-relaxed"></textarea>
          </div>
          <div class="border border-border-medium rounded-xl overflow-hidden focus-within:border-primary focus-within:shadow-focus transition-all duration-200">
            <label for="note" class="sr-only">یادداشت</label>
            <textarea id="note" name="note" rows="2" placeholder="یادداشت سفارش (اختیاری)" class="w-full px-lg py-3.5 text-base outline-none bg-transparent resize-y leading-relaxed"></textarea>
          </div>
          <button type="submit" class="bg-primary text-white px-xl py-md rounded-lg font-medium text-base leading-normal hover:-translate-y-0.5 hover:shadow-button transition-all duration-200 inline-flex items-center justify-center gap-2">
            ثبت سفارش
          </button>
        </form>
      </aside>
    </div>
  </main>

  <div id="site-footer"></div>
  <div id="site-bottom-nav"></div>

  <script src="js/app.js"></script>
  <script src="js/checkout.js"></script>
</body>
</html>
