<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پلتفرم مدیریت اضافه‌کاری</title>
  <link rel="stylesheet" href="https://c7n.ir/fonts/sahel/load.css">
  <style>
    /* ---------------------------------- */
    /* CSS Reset & Setup                  */
    /* ---------------------------------- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    *, *::before, *::after, button, input, select, textarea {
      font-family: 'Sahel', sans-serif;
    }

    :root {
      /* رنگ‌های پایه — Dark Mode (بنچمارک: Booman) */
      --color-bg:           #000000;
      --color-bg-elevated:  #0a0a0a;
      --color-surface:      #141414;
      --color-surface-2:    #1c1c1e;
      --color-surface-3:    #242426;
      --color-border:       rgba(255, 255, 255, 0.08);
      --color-border-strong:rgba(255, 255, 255, 0.14);
      --color-transparent:  rgba(0, 0, 0, 0);

      /* متن */
      --color-text:         #ffffff;
      --color-text-muted:   #8e8e93;
      --color-text-subtle:  #6b6b70;

      /* رنگ تأکیدی و CTA */
      --color-primary:      #ffffff;
      --color-on-primary:   #000000;
      --color-accent:       #c9a45c;
      --color-danger:       #ff453a;
      --color-success:      #30d158;

      /* گرادیان نورپردازی بالای صفحه */
      --gradient-spotlight: radial-gradient(ellipse 80% 50% at 50% 0%, rgba(255,255,255,0.08), rgba(0,0,0,0) 70%);

      /* فاصله‌گذاری */
      --space-xs: 4px;
      --space-sm: 8px;
      --space-md: 16px;
      --space-lg: 24px;
      --space-xl: 40px;
      --space-2xl: 64px;

      /* اندازه فونت */
      --fs-xs: 12px;
      --fs-sm: 14px;
      --fs-base: 16px;
      --fs-lg: 20px;
      --fs-xl: 28px;
      --fs-2xl: 40px;

      /* شعاع گوشه */
      --radius-sm: 8px;
      --radius-md: 16px;
      --radius-lg: 24px;
      --radius-xl: 32px;
      --radius-full: 999px;

      /* سایه‌ها */
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.4);
      --shadow-md: 0 4px 16px rgba(0,0,0,0.5);
      --shadow-lg: 0 16px 48px rgba(0,0,0,0.6);
      --shadow-glow: 0 0 0 1px rgba(255,255,255,0.06);

      /* انتقال */
      --transition: 0.25s ease;

      /* ابعاد چیدمان */
      --container: 1200px;
      --bottom-nav-max-width: 480px;
      --bottom-nav-height: 72px;
    }

    body {
      background-color: var(--color-bg);
      color: var(--color-text);
      font-size: var(--fs-base);
      line-height: 1.5;
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 50vh;
      background: var(--gradient-spotlight);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      max-width: var(--container);
      margin: 0 auto;
      padding: 0 var(--space-md);
      position: relative;
      z-index: 1;
    }

    /* ---------------------------------- */
    /* Components                         */
    /* ---------------------------------- */
    header {
      padding: var(--space-xl) 0 var(--space-lg);
      text-align: center;
    }

    h1 {
      font-size: var(--fs-xl);
      font-weight: 700;
      margin-bottom: var(--space-xs);
    }

    .subtitle {
      color: var(--color-text-muted);
      font-size: var(--fs-sm);
    }

    .card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: var(--space-lg);
      margin-bottom: var(--space-md);
      box-shadow: var(--shadow-md);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: var(--space-sm);
      margin-bottom: var(--space-md);
    }

    label {
      color: var(--color-text-muted);
      font-size: var(--fs-sm);
    }

    input, select {
      background: var(--color-surface-2);
      border: 1px solid var(--color-border-strong);
      color: var(--color-text);
      padding: var(--space-md);
      border-radius: var(--radius-md);
      font-size: var(--fs-base);
      transition: border var(--transition);
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--color-accent);
    }

    input::placeholder {
      color: var(--color-text-subtle);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-md) var(--space-lg);
      border-radius: var(--radius-full);
      font-weight: bold;
      cursor: pointer;
      border: none;
      transition: background var(--transition), transform var(--transition);
      width: 100%;
      font-size: var(--fs-base);
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: var(--color-primary);
      color: var(--color-on-primary);
    }

    .btn-outline {
      background: var(--color-transparent);
      color: var(--color-text);
      border: 1px solid var(--color-border-strong);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-md);
    }

    /* Summary Stats */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: var(--space-md);
      margin-bottom: var(--space-lg);
    }

    .stat-card {
      background: var(--color-surface-2);
      padding: var(--space-md);
      border-radius: var(--radius-md);
      text-align: center;
      border: 1px solid var(--color-border);
    }

    .stat-value {
      font-size: var(--fs-lg);
      font-weight: bold;
      color: var(--color-accent);
      margin-top: var(--space-xs);
    }

    /* List Items */
    .entry-list {
      display: flex;
      flex-direction: column;
      gap: var(--space-sm);
    }

    .entry-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--color-surface-2);
      padding: var(--space-md);
      border-radius: var(--radius-md);
      border: 1px solid var(--color-border);
    }

    .entry-info {
      display: flex;
      flex-direction: column;
      gap: var(--space-xs);
    }

    .entry-title {
      font-weight: bold;
    }

    .entry-meta {
      font-size: var(--fs-xs);
      color: var(--color-text-muted);
    }

    .entry-actions button {
      background: var(--color-transparent);
      border: none;
      color: var(--color-danger);
      cursor: pointer;
      font-size: var(--fs-sm);
      padding: var(--space-xs);
    }

    /* Bottom Navigation - STRICTLY AS REQUESTED */
    .bottom-nav {
      position: fixed;
      bottom: var(--space-lg);
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - var(--space-lg) * 2);
      max-width: var(--bottom-nav-max-width);
      height: var(--bottom-nav-height);
      display: flex;
      align-items: center;
      justify-content: space-around;
      background: var(--color-surface-2);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-full);
      box-shadow: var(--shadow-lg), var(--shadow-glow);
      backdrop-filter: blur(20px);
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-xs);
      color: var(--color-text-muted);
      text-decoration: none;
      font-size: var(--fs-xs);
      transition: color var(--transition);
      cursor: pointer;
    }

    .nav-item.active, .nav-item:hover {
      color: var(--color-primary);
    }

    .nav-icon {
      width: 24px;
      height: 24px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Tab Management */
    .tab-content {
      display: none;
      padding-bottom: calc(var(--bottom-nav-height) + var(--space-2xl));
    }
    .tab-content.active {
      display: block;
      animation: fadeIn var(--transition);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Hide element utility */
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <header class="container">
    <h1>گزارش کار</h1>
    <div class="subtitle">مدیریت هوشمند اضافه‌کاری</div>
  </header>

  <main class="container">
    
    <!-- Tab 1: Dashboard (List & Stats) -->
    <section id="tab-dashboard" class="tab-content active">
      <div class="stats-grid">
        <div class="stat-card">
          <div class="subtitle">کل درآمد (تومان)</div>
          <div class="stat-value" id="total-amount">0</div>
        </div>
        <div class="stat-card">
          <div class="subtitle">کل ساعات</div>
          <div class="stat-value" id="total-hours">0</div>
        </div>
      </div>

      <div class="card">
        <h2 style="font-size: var(--fs-lg); margin-bottom: var(--space-md);">تاریخچه ثبت</h2>
        <div class="entry-list" id="entries-container">
          <!-- Entries injected via JS -->
        </div>
      </div>
    </section>

    <!-- Tab 2: Add Entry -->
    <section id="tab-add" class="tab-content">
      <div class="card">
        <form id="add-form">
          <div class="form-group">
            <label for="job-select">انتخاب شغل</label>
            <select id="job-select" required>
              <option value="" disabled selected>یک شغل انتخاب کنید...</option>
              <!-- Jobs injected via JS -->
            </select>
          </div>

          <div class="form-group">
            <label for="entry-date">تاریخ</label>
            <input type="date" id="entry-date" required>
          </div>

          <div class="grid-2">
            <div class="form-group">
              <label for="start-time">ساعت شروع</label>
              <input type="time" id="start-time" required>
            </div>
            <div class="form-group">
              <label for="end-time">ساعت پایان</label>
              <input type="time" id="end-time" required>
            </div>
          </div>

          <div class="form-group">
            <label for="hourly-rate">مبلغ هر ساعت (تومان)</label>
            <input type="number" id="hourly-rate" required>
          </div>

          <button type="submit" class="btn btn-primary">ثبت اضافه‌کاری</button>
        </form>
      </div>
    </section>

    <!-- Tab 3: Settings (Jobs) -->
    <section id="tab-settings" class="tab-content">
      <div class="card">
        <h2 style="font-size: var(--fs-lg); margin-bottom: var(--space-md);">تعریف شغل جدید</h2>
        <form id="job-form">
          <div class="form-group">
            <label for="job-name">عنوان شغل</label>
            <input type="text" id="job-name" placeholder="مثال: برنامه‌نویسی" required>
          </div>
          <div class="form-group">
            <label for="job-rate">مبلغ پیش‌فرض هر ساعت (تومان)</label>
            <input type="number" id="job-rate" placeholder="مثال: 150000" required>
          </div>
          <button type="submit" class="btn btn-outline">ذخیره شغل</button>
        </form>
      </div>
      
      <div class="card">
        <h3 style="font-size: var(--fs-base); margin-bottom: var(--space-sm); color: var(--color-text-muted);">مشاغل ثبت شده</h3>
        <div class="entry-list" id="jobs-container">
          <!-- Jobs list injected via JS -->
        </div>
      </div>
    </section>

  </main>

  <nav class="bottom-nav">
    <div class="nav-item active" onclick="switchTab('tab-dashboard', this)">
      <svg class="nav-icon" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
      <span>داشبورد</span>
    </div>
    <div class="nav-item" onclick="switchTab('tab-add', this)">
      <svg class="nav-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line></svg>
      <span>ثبت جدید</span>
    </div>
    <div class="nav-item" onclick="switchTab('tab-settings', this)">
      <svg class="nav-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
      <span>مشاغل</span>
    </div>
  </nav>

  <script>
    // State Management
    let jobs = JSON.parse(localStorage.getItem('jobs')) || [];
    let entries = JSON.parse(localStorage.getItem('entries')) || [];

    // DOM Elements
    const jobSelect = document.getElementById('job-select');
    const jobRateInput = document.getElementById('hourly-rate');

    // Init App
    function init() {
      updateJobSelect();
      renderJobs();
      renderEntries();
      
      // Default Date to Today
      document.getElementById('entry-date').valueAsDate = new Date();
    }

    // Tab Switching
    function switchTab(tabId, element) {
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
      
      document.getElementById(tabId).classList.add('active');
      element.classList.add('active');
    }

    // Utility: Format Number to Toman
    function formatMoney(amount) {
      return new Intl.NumberFormat('fa-IR').format(amount);
    }

    // Utility: Format Date to Jalali
    function formatJalali(dateString) {
      const date = new Date(dateString);
      return new Intl.DateTimeFormat('fa-IR', { year: 'numeric', month: 'long', day: 'numeric' }).format(date);
    }

    // Calculate Hours Difference
    function getHoursDiff(start, end) {
      const [sh, sm] = start.split(':').map(Number);
      const [eh, em] = end.split(':').map(Number);
      let diff = (eh + em/60) - (sh + sm/60);
      if (diff < 0) diff += 24; // Cross midnight
      return diff;
    }

    // Job Management
    document.getElementById('job-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const name = document.getElementById('job-name').value;
      const rate = document.getElementById('job-rate').value;
      
      const newJob = { id: Date.now().toString(), name, rate: Number(rate) };
      jobs.push(newJob);
      localStorage.setItem('jobs', JSON.stringify(jobs));
      
      this.reset();
      updateJobSelect();
      renderJobs();
    });

    function updateJobSelect() {
      jobSelect.innerHTML = '<option value="" disabled selected>یک شغل انتخاب کنید...</option>';
      jobs.forEach(job => {
        const opt = document.createElement('option');
        opt.value = job.id;
        opt.textContent = job.name;
        jobSelect.appendChild(opt);
      });
    }

    jobSelect.addEventListener('change', function() {
      const selectedJob = jobs.find(j => j.id === this.value);
      if (selectedJob) {
        jobRateInput.value = selectedJob.rate;
      }
    });

    function renderJobs() {
      const container = document.getElementById('jobs-container');
      container.innerHTML = '';
      jobs.forEach(job => {
        const div = document.createElement('div');
        div.className = 'entry-item';
        div.innerHTML = `
          <div class="entry-info">
            <span class="entry-title">${job.name}</span>
            <span class="entry-meta">${formatMoney(job.rate)} تومان / ساعت</span>
          </div>
          <div class="entry-actions">
            <button onclick="deleteJob('${job.id}')">حذف</button>
          </div>
        `;
        container.appendChild(div);
      });
    }

    function deleteJob(id) {
      jobs = jobs.filter(j => j.id !== id);
      localStorage.setItem('jobs', JSON.stringify(jobs));
      updateJobSelect();
      renderJobs();
    }

    // Entry Management
    document.getElementById('add-form').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const jobId = jobSelect.value;
      const job = jobs.find(j => j.id === jobId);
      const date = document.getElementById('entry-date').value;
      const start = document.getElementById('start-time').value;
      const end = document.getElementById('end-time').value;
      const rate = Number(jobRateInput.value);
      
      const hours = getHoursDiff(start, end);
      const totalAmount = hours * rate;

      const newEntry = {
        id: Date.now().toString(),
        jobName: job.name,
        date,
        start,
        end,
        hours,
        rate,
        totalAmount
      };

      entries.push(newEntry);
      localStorage.setItem('entries', JSON.stringify(entries));
      
      this.reset();
      document.getElementById('entry-date').valueAsDate = new Date(); // reset date
      updateJobSelect(); // reset select visually
      
      renderEntries();
      switchTab('tab-dashboard', document.querySelector('.nav-item')); // Go back to dash
    });

    function renderEntries() {
      const container = document.getElementById('entries-container');
      container.innerHTML = '';
      
      let totalMoney = 0;
      let totalH = 0;

      // Sort by date descending
      const sortedEntries = [...entries].sort((a, b) => new Date(b.date) - new Date(a.date));

      sortedEntries.forEach(entry => {
        totalMoney += entry.totalAmount;
        totalH += entry.hours;

        const div = document.createElement('div');
        div.className = 'entry-item';
        div.innerHTML = `
          <div class="entry-info">
            <span class="entry-title">${entry.jobName}</span>
            <span class="entry-meta">${formatJalali(entry.date)} | ${entry.start} تا ${entry.end} (${entry.hours.toFixed(1)} ساعت)</span>
            <span class="entry-meta" style="color: var(--color-accent);">${formatMoney(entry.totalAmount)} تومان</span>
          </div>
          <div class="entry-actions">
            <button onclick="deleteEntry('${entry.id}')">حذف</button>
          </div>
        `;
        container.appendChild(div);
      });

      document.getElementById('total-amount').textContent = formatMoney(totalMoney);
      document.getElementById('total-hours').textContent = totalH.toFixed(1);
    }

    function deleteEntry(id) {
      entries = entries.filter(e => e.id !== id);
      localStorage.setItem('entries', JSON.stringify(entries));
      renderEntries();
    }

    // Run Init
    init();
  </script>
</body>
</html>
