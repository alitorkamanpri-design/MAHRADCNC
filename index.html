<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="فروشگاه قطعات CNC مهراد — ریل، واگن، اسپیندل و کنترلر">
  <meta property="og:title" content="MahradCNC — فروش قطعات سی‌ان‌سی">
  <meta property="og:description" content="کاتالوگ صنعتی قطعات CNC با SKU و مشخصات فنی">
  <meta property="og:image" content="img/icon.png">
  <link rel="icon" href="img/icon.png" type="image/png">
  <link rel="canonical" href="index.html">
  <title>MahradCNC — فروش قطعات سی‌ان‌سی</title>
  <link rel="stylesheet" href="/css/main.css">
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/sahel-font@v3.4.0/dist/font-face.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body class="bg-bg-secondary text-text-primary min-h-screen flex flex-col">
  <div id="site-header"></div>

  <main class="flex-1">
    <!-- Hero -->
    <section id="hero" class="relative min-h-[85vh] md:min-h-[90vh] flex items-end overflow-hidden bg-text-primary" aria-label="معرفی">
      <img id="hero-image" src="img/18.png" alt="قطعات صنعتی CNC مهراد" class="absolute inset-0 w-full h-full object-cover opacity-60" fetchpriority="high">
      <div class="absolute inset-0 bg-gradient-to-t from-text-primary via-text-primary/70 to-text-primary/20"></div>
      <div class="relative z-10 w-full max-w-7xl mx-auto px-lg md:px-3xl pb-4xl md:pb-5xl pt-5xl">
        <p id="hero-brand" class="text-primary text-lg md:text-xl font-bold tracking-wide mb-md">MahradCNC</p>
        <h1 id="hero-headline" class="text-3xl md:text-4xl font-bold text-white leading-tight max-w-2xl mb-lg">قطعات دقیق CNC برای تولید حرفه‌ای</h1>
        <p id="hero-subtitle" class="text-base md:text-lg text-white/80 leading-relaxed max-w-xl mb-2xl">ریل، واگن، اسپیندل و کنترلر — اصالت کالا و ارسال سریع</p>
        <div class="flex flex-wrap gap-md" id="hero-ctas">
          <a href="shop.html" class="bg-primary text-white px-xl py-md rounded-lg font-medium text-base leading-normal hover:-translate-y-0.5 hover:shadow-button transition-all duration-200 inline-flex items-center gap-2">مشاهده فروشگاه</a>
          <a href="tel:02133980931" class="bg-white/10 text-white border border-white/30 px-xl py-md rounded-lg font-medium text-base leading-normal hover:bg-white/20 transition-all duration-200 inline-flex items-center gap-2">مشاوره تخصصی</a>
        </div>
      </div>
    </section>

    <!-- Categories -->
    <section class="max-w-7xl mx-auto px-lg md:px-3xl py-4xl" aria-labelledby="cat-title">
      <div class="flex items-end justify-between gap-lg mb-2xl">
        <h2 id="cat-title" class="text-2xl font-semibold text-text-primary leading-snug">دسته‌بندی محصولات</h2>
        <a href="shop.html" class="text-sm text-accent hover:text-primary transition-colors duration-150">مشاهده همه</a>
      </div>
      <div id="categories-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-lg"></div>
    </section>

    <!-- Newest -->
    <section class="bg-bg-primary border-y border-border-light py-4xl" aria-labelledby="newest-title">
      <div class="max-w-7xl mx-auto px-lg md:px-3xl">
        <div class="flex items-end justify-between gap-lg mb-2xl">
          <h2 id="newest-title" class="text-2xl font-semibold text-text-primary leading-snug">جدیدترین محصولات</h2>
          <a href="shop.html?sort=newest" class="text-sm text-accent hover:text-primary transition-colors duration-150">مشاهده همه</a>
        </div>
        <div id="newest-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-lg"></div>
      </div>
    </section>

    <!-- Bestsellers -->
    <section class="max-w-7xl mx-auto px-lg md:px-3xl py-4xl" aria-labelledby="best-title">
      <div class="flex items-end justify-between gap-lg mb-2xl">
        <h2 id="best-title" class="text-2xl font-semibold text-text-primary leading-snug">پرفروش‌ترین محصولات</h2>
        <a href="shop.html?sort=bestseller" class="text-sm text-accent hover:text-primary transition-colors duration-150">مشاهده همه</a>
      </div>
      <div id="bestseller-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-lg"></div>
    </section>

    <!-- Trust -->
    <section class="bg-accent-soft py-4xl" aria-label="اعتماد">
      <div class="max-w-7xl mx-auto px-lg md:px-3xl grid grid-cols-1 md:grid-cols-3 gap-3xl" id="trust-row"></div>
    </section>
  </main>

  <div id="site-footer"></div>
  <div id="site-bottom-nav"></div>

  <script src="js/app.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
