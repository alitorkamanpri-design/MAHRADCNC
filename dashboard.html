<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="img/icon.png" type="image/png">
  <title>داشبورد کاربر — MahradCNC</title>
  <link rel="stylesheet" href="css/main.css">
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/sahel-font@v3.4.0/dist/font-face.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body class="bg-bg-secondary text-text-primary min-h-screen flex flex-col">
  <div id="site-header"></div>

  <main class="flex-1 max-w-7xl mx-auto w-full px-lg md:px-3xl py-2xl md:py-3xl">
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-lg mb-2xl">
      <div class="flex items-center gap-lg">
        <div class="w-14 h-14 rounded-full bg-nav-soft text-nav flex items-center justify-center text-xl" aria-hidden="true">
          <i class="fa-solid fa-user"></i>
        </div>
        <div>
          <h1 class="text-2xl font-bold leading-tight" id="dash-greeting">حساب کاربری</h1>
          <p class="text-sm text-text-secondary" id="dash-phone"></p>
          <span id="guest-badge" class="hidden inline-flex mt-sm text-xs bg-nav-soft text-nav px-md py-sm rounded-md">مهمان (ذخیره محلی)</span>
        </div>
      </div>
    </div>

    <div class="flex gap-sm overflow-x-auto mb-2xl border-b border-border-light pb-px" role="tablist" aria-label="بخش‌های داشبورد">
      <button type="button" role="tab" data-tab="profile" class="dash-tab shrink-0 px-xl py-md text-sm font-medium border-b-2 border-transparent text-text-secondary" aria-selected="true">پروفایل</button>
      <button type="button" role="tab" data-tab="orders" class="dash-tab shrink-0 px-xl py-md text-sm font-medium border-b-2 border-transparent text-text-secondary" aria-selected="false">سفارش‌ها</button>
      <button type="button" role="tab" data-tab="wishlist" class="dash-tab shrink-0 px-xl py-md text-sm font-medium border-b-2 border-transparent text-text-secondary" aria-selected="false">علاقه‌مندی‌ها</button>
      <button type="button" role="tab" data-tab="address" class="dash-tab shrink-0 px-xl py-md text-sm font-medium border-b-2 border-transparent text-text-secondary" aria-selected="false">آدرس</button>
    </div>

    <div id="panel-profile" role="tabpanel" class="dash-panel"></div>
    <div id="panel-orders" role="tabpanel" class="dash-panel hidden" hidden></div>
    <div id="panel-wishlist" role="tabpanel" class="dash-panel hidden" hidden></div>
    <div id="panel-address" role="tabpanel" class="dash-panel hidden" hidden></div>
  </main>

  <div id="site-footer"></div>
  <div id="site-bottom-nav"></div>

  <script src="js/app.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
