<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="فروشگاه قطعات CNC مهراد — کاتالوگ صنعتی ریل، واگن، اسپیندل و کنترلر">
  <meta property="og:title" content="فروشگاه — MahradCNC">
  <meta property="og:description" content="کاتالوگ صنعتی قطعات CNC با فیلتر مشخصات فنی و کد مدل">
  <meta property="og:image" content="img/icon.png">
  <link rel="icon" href="img/icon.png" type="image/png">
  <link rel="canonical" href="shop.html">
  <title>فروشگاه — MahradCNC</title>
  <link rel="stylesheet" href="/css/main.css">
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/sahel-font@v3.4.0/dist/font-face.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body class="bg-bg-secondary text-text-primary min-h-screen flex flex-col">
  <div id="site-header"></div>

  <main class="flex-1 max-w-7xl mx-auto w-full px-lg md:px-3xl py-2xl md:py-3xl">
    <div class="flex flex-col md:flex-row md:items-end justify-between gap-lg mb-xl">
      <div>
        <h1 class="text-2xl md:text-3xl font-bold text-text-primary leading-tight">فروشگاه</h1>
        <p id="result-count" class="text-sm text-text-secondary mt-sm">در حال بارگذاری...</p>
      </div>
      <div class="flex flex-wrap items-center gap-md">
        <button type="button" id="filter-open" class="lg:hidden bg-bg-primary border border-border-medium px-lg py-md rounded-lg text-sm font-medium inline-flex items-center gap-2">
          <i class="fa-solid fa-sliders" aria-hidden="true"></i> فیلتر
        </button>
        <div class="hidden md:flex border border-border-medium rounded-lg overflow-hidden">
          <button type="button" id="view-grid" class="px-md py-md text-sm" aria-label="نمای کارت"><i class="fa-solid fa-border-all"></i></button>
          <button type="button" id="view-table" class="px-md py-md text-sm border-r border-border-medium" aria-label="نمای جدول"><i class="fa-solid fa-table-list"></i></button>
        </div>
        <label for="sort-select" class="sr-only">مرتب‌سازی</label>
        <select id="sort-select" class="bg-bg-primary border border-border-medium rounded-lg px-lg py-md text-sm text-text-primary outline-none focus:border-primary focus:shadow-focus">
          <option value="default">مرتب‌سازی پیش‌فرض</option>
          <option value="newest">جدیدترین</option>
          <option value="bestseller">پرفروش</option>
          <option value="price-asc">ارزان‌ترین</option>
          <option value="price-desc">گران‌ترین</option>
        </select>
      </div>
    </div>

    <div id="active-chips" class="hidden flex flex-wrap gap-sm mb-xl"></div>

    <div class="flex gap-3xl items-start">
      <aside class="hidden lg:block w-64 shrink-0" aria-label="فیلتر دسته‌ها">
        <div class="bg-bg-primary border border-border-light rounded-xl shadow-sm py-lg sticky top-24 max-h-[calc(100vh-7rem)] overflow-y-auto">
          <h2 class="text-lg font-semibold mb-md px-xl">فیلترها</h2>
          <div id="category-filters" class="flex flex-col"></div>
        </div>
      </aside>

      <div class="flex-1 min-w-0">
        <div id="products-grid" class="grid grid-cols-2 md:grid-cols-3 gap-lg"></div>
        <div id="products-table-wrap" class="hidden bg-bg-primary border border-border-light rounded-xl shadow-sm overflow-x-auto">
          <table class="w-full text-sm">
            <thead class="bg-bg-secondary text-text-secondary text-xs">
              <tr>
                <th class="text-right py-md px-md font-medium">محصول</th>
                <th class="text-right py-md px-md font-medium">SKU</th>
                <th class="text-right py-md px-md font-medium hidden md:table-cell">مشخصه</th>
                <th class="text-right py-md px-md font-medium">موجودی</th>
                <th class="text-right py-md px-md font-medium">قیمت</th>
                <th class="text-right py-md px-md font-medium">عملیات</th>
              </tr>
            </thead>
            <tbody id="products-table-body"></tbody>
          </table>
        </div>
        <div id="shop-empty" class="hidden"></div>
        <div id="pager" class="flex items-center justify-center gap-lg mt-3xl"></div>
      </div>
    </div>
  </main>

  <div id="filter-drawer" class="fixed inset-0 z-[60] hidden" role="dialog" aria-modal="true" aria-labelledby="filter-drawer-title" hidden>
    <div class="absolute inset-0 bg-text-primary/40" data-close-drawer></div>
    <div class="absolute bottom-0 inset-x-0 bg-bg-primary rounded-t-2xl p-2xl max-h-[80vh] overflow-y-auto animate-slide-up">
      <div class="flex items-center justify-between mb-xl">
        <h2 id="filter-drawer-title" class="text-xl font-semibold">فیلتر</h2>
        <button type="button" class="w-10 h-10 rounded-lg border border-border-light" data-close-drawer aria-label="بستن"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div id="category-filters-mobile" class="flex flex-col mb-2xl"></div>
      <button type="button" class="w-full bg-primary text-white px-xl py-md rounded-lg font-medium" data-close-drawer>اعمال</button>
    </div>
  </div>

  <div id="site-footer"></div>
  <div id="site-bottom-nav"></div>

  <script src="js/app.js"></script>
  <script src="js/shop.js"></script>
</body>
</html>
