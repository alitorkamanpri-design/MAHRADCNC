<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Tasker — پروفایل</title>
  <link rel="stylesheet" href="/src/css/main.css">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0d9488">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="https://c7n.ir/fonts/sahel/load.css" crossorigin="anonymous">
<!-- All styles (recommended) -->
<link rel="stylesheet" href="https://c7n.ir/icons/fontawesome/6.7.2/css/all.min.css"></head>
<body class="bg-bg-app">

<div class="page-container">

  <!-- ── Hero Section ── -->
  <div class="hero-gradient px-lg pt-lg pb-2xl relative">
    <!-- Top bar -->
    <div class="flex items-center justify-between mb-2xl">
      <a href="/index.html" class="w-9 h-9 rounded-full bg-white/20 flex items-center justify-center text-white hover:bg-white/30 transition-colors">
        <i class="fa-solid fa-arrow-right text-sm"></i>
      </a>
      <h2 class="text-base font-semibold text-white">پروفایل من</h2>
      <div class="w-9"></div>
    </div>

    <!-- Avatar -->
    <div class="flex flex-col items-center gap-md">
      <div class="relative">
        <div class="w-24 h-24 rounded-full overflow-hidden border-4 border-white shadow-lg bg-white/20 flex items-center justify-center">
          <i class="fa-solid fa-user text-4xl text-white/80" id="profileAvatarIcon"></i>
          <img id="profileAvatarImg" class="w-full h-full object-cover hidden absolute inset-0" alt="آواتار">
        </div>
        <!-- Camera button -->
        <button id="changeAvatarBtn"
          class="absolute bottom-0 left-0 w-8 h-8 rounded-full bg-primary border-2 border-white flex items-center justify-center shadow-sm hover:bg-primary-hover transition-colors">
          <i class="fa-solid fa-camera text-white text-xs"></i>
        </button>
        <input type="file" id="avatarInput" accept="image/*" class="hidden">
      </div>
      <div class="text-center">
        <h2 class="text-xl font-bold text-white" id="profileNameDisplay">ماریا احمدی</h2>
        <p class="text-sm text-white/75" id="profileEmailDisplay">maria@example.com</p>
      </div>
    </div>
  </div>

  <!-- ── Stats Row ── -->
  <div class="px-lg -mt-xl pb-xl grid grid-cols-3 gap-md">
    <div class="stat-card bg-stat-upcoming rounded-2xl shadow-md">
      <p class="text-xs font-medium text-white/80">کل تسک</p>
      <p class="text-2xl font-bold text-white" id="pStatTotal">0</p>
      <p class="text-xs text-white/70">تسک</p>
    </div>
    <div class="stat-card bg-stat-today rounded-2xl shadow-md">
      <p class="text-xs font-medium text-white/80">تکمیل شده</p>
      <p class="text-2xl font-bold text-white" id="pStatDone">0</p>
      <p class="text-xs text-white/70">تسک</p>
    </div>
    <div class="stat-card bg-stat-completed rounded-2xl shadow-md">
      <p class="text-xs font-medium text-white/80">موفقیت</p>
      <p class="text-2xl font-bold text-white" id="pStatRate">0%</p>
      <p class="text-xs text-white/70">نرخ</p>
    </div>
  </div>

  <!-- ── Edit Form ── -->
  <div class="px-lg pb-xl">
    <div class="card p-2xl">
      <h3 class="section-title mb-xl">اطلاعات شخصی</h3>
      <div class="flex flex-col gap-lg">
        <!-- Name -->
        <div>
          <label class="block text-sm font-medium text-text-secondary mb-1.5">نام کامل</label>
          <input type="text" id="pName" class="input-field" placeholder="نام خود را وارد کنید">
        </div>
        <!-- Email -->
        <div>
          <label class="block text-sm font-medium text-text-secondary mb-1.5">ایمیل</label>
          <input type="email" id="pEmail" class="input-field" placeholder="email@example.com" dir="ltr">
        </div>
        <!-- Bio -->
        <div>
          <label class="block text-sm font-medium text-text-secondary mb-1.5">بیوگرافی</label>
          <textarea id="pBio" class="input-field resize-none" rows="3" placeholder="درباره خودتان بنویسید..."></textarea>
        </div>
        <!-- Save button -->
        <button class="btn-primary w-full mt-sm" id="saveProfileBtn">
          <i class="fa-solid fa-check"></i>ذخیره تغییرات
        </button>
      </div>
    </div>
  </div>

  <!-- ── App Info ── -->
  <div class="px-lg pb-xl">
    <div class="card p-xl flex items-center justify-between text-text-muted">
      <div class="flex items-center gap-md">
        <div class="w-10 h-10 rounded-xl bg-primary-soft flex items-center justify-center">
          <i class="fa-solid fa-circle-check text-primary text-lg"></i>
        </div>
        <div>
          <p class="text-sm font-semibold text-text-primary">Tasker PWA</p>
          <p class="text-xs text-text-muted">نسخه ۱.۰.۰</p>
        </div>
      </div>
      <i class="fa-solid fa-chevron-left text-xs"></i>
    </div>
  </div>

</div>

<!-- ── FAB ── -->
<button class="btn-fab fixed z-50 bottom-24 left-1/2 -translate-x-1/2" id="fabBtn">
  <i class="fa-solid fa-plus"></i>
</button>

<!-- ── Bottom Navigation ── -->
<nav class="fixed bottom-0 left-0 right-0 bg-bg-nav z-40" style="box-shadow:0 -2px 16px rgba(15,23,42,0.06)">
  <div class="nav-inner">
    <a href="/index.html" class="nav-item" data-page="home">
      <i class="fa-solid fa-house text-xl"></i>
      <span>خانه</span>
    </a>
    <a href="/src/pages/calendar.html" class="nav-item" data-page="calendar">
      <i class="fa-solid fa-calendar text-xl"></i>
      <span>تقویم</span>
    </a>
    <a href="/src/pages/tasks.html" class="nav-item" data-page="tasks">
      <i class="fa-solid fa-list-check text-xl"></i>
      <span>تسک</span>
    </a>
    <a href="/src/pages/profile.html" class="nav-item" data-page="profile">
      <i class="fa-solid fa-user text-xl"></i>
      <span>پروفایل</span>
    </a>
  </div>
</nav>

<script type="module" src="/src/js/profile.js"></script>
<script>if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js')</script>
</body>
</html>
