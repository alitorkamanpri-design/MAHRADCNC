<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="کمپین صنعتی MahradCNC — تأمین قطعات CNC با مشخصات فنی دقیق">
  <meta property="og:title" content="کمپین صنعتی — MahradCNC">
  <meta property="og:description" content="تأمین مطمئن قطعات صنعتی CNC">
  <meta property="og:image" content="img/icon.png">
  <link rel="icon" href="img/icon.png" type="image/png">
  <link rel="canonical" href="landing.html">
  <title>کمپین صنعتی — MahradCNC</title>
  <link rel="stylesheet" href="/css/main.css">
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/sahel-font@v3.4.0/dist/font-face.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body class="bg-bg-secondary text-text-primary min-h-screen flex flex-col">
  <div id="site-header"></div>

  <main class="flex-1">
    <section class="relative min-h-[80vh] flex items-end overflow-hidden bg-text-primary" aria-label="لندینگ">
      <img id="land-hero-img" src="img/7.png" alt="قطعات صنعتی CNC" class="absolute inset-0 w-full h-full object-cover opacity-55">
      <div class="absolute inset-0 bg-gradient-to-t from-text-primary via-text-primary/75 to-nav/40"></div>
      <div class="relative z-10 max-w-7xl mx-auto w-full px-lg md:px-3xl pb-4xl pt-5xl">
        <p id="land-brand" class="text-primary text-lg md:text-xl font-bold mb-md">MahradCNC</p>
        <h1 id="land-headline" class="text-3xl md:text-4xl font-bold text-white leading-tight max-w-2xl mb-lg">تأمین مطمئن قطعات صنعتی CNC</h1>
        <p id="land-subtitle" class="text-base md:text-lg text-white/80 max-w-xl mb-2xl leading-relaxed"></p>
        <div id="land-ctas" class="flex flex-wrap gap-md"></div>
      </div>
    </section>

    <section class="max-w-7xl mx-auto px-lg md:px-3xl py-4xl" aria-labelledby="features-title">
      <h2 id="features-title" class="text-2xl font-semibold text-center mb-3xl">چرا MahradCNC؟</h2>
      <div id="features-grid" class="grid grid-cols-1 md:grid-cols-3 gap-3xl"></div>
    </section>

    <section class="bg-nav text-white py-4xl" aria-label="آمار">
      <div id="stats-row" class="max-w-7xl mx-auto px-lg md:px-3xl grid grid-cols-1 sm:grid-cols-3 gap-3xl text-center"></div>
    </section>

    <section class="max-w-7xl mx-auto px-lg md:px-3xl py-4xl" aria-labelledby="cases-title">
      <h2 id="cases-title" class="text-2xl font-semibold mb-3xl">نمونه پروژه‌های تجهیز‌شده</h2>
      <div id="cases-grid" class="grid grid-cols-1 md:grid-cols-2 gap-3xl"></div>
    </section>

    <section class="max-w-7xl mx-auto px-lg md:px-3xl py-4xl" aria-labelledby="feat-products-title">
      <div class="flex items-end justify-between mb-2xl">
        <h2 id="feat-products-title" class="text-2xl font-semibold">نمونه محصولات</h2>
        <a href="shop.html" class="text-sm text-nav hover:text-primary">فروشگاه کامل</a>
      </div>
      <div id="featured-grid" class="grid grid-cols-2 md:grid-cols-4 gap-lg"></div>
    </section>

    <section class="max-w-7xl mx-auto px-lg md:px-3xl pb-5xl">
      <div id="cta-banner" class="bg-primary-soft border border-primary/20 rounded-2xl p-3xl md:p-4xl flex flex-col md:flex-row md:items-center justify-between gap-2xl"></div>
    </section>
  </main>

  <div id="site-footer"></div>
  <div id="site-bottom-nav"></div>

  <script src="js/app.js"></script>
  <script src="js/landing.js"></script>
</body>
</html>
