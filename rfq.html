<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>درخواست قیمت (RFQ) — MahradCNC</title>
  <link rel="icon" href="/MAHRADCNC/assets/icon-eyVgWEJK.png" type="image/png">
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/sahel-font@v3.4.0/dist/font-face.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" crossorigin href="/MAHRADCNC/assets/main-CeXhcROz.css">
</head>
<body class="bg-bg-secondary text-text-primary min-h-screen flex flex-col">
  <div id="site-header"></div>
  <main class="flex-1 max-w-3xl mx-auto w-full px-lg md:px-3xl py-2xl">
    <h1 class="text-2xl font-bold mb-md">درخواست قیمت چندخطی</h1>
    <p class="text-sm text-text-secondary mb-2xl">اقلام سبد یا مقایسه را به واتساپ ارسال کنید.</p>
    <form id="rfq-form" class="bg-bg-primary border border-border-light rounded-xl shadow-sm p-xl flex flex-col gap-lg">
      <div class="border border-border-medium rounded-xl overflow-hidden focus-within:border-primary focus-within:shadow-focus">
        <div class="flex"><label for="company" class="bg-bg-secondary border-l border-border-light min-w-[110px] px-lg py-3.5 text-sm flex items-center">شرکت</label>
        <input id="company" name="company" class="flex-1 px-lg py-3.5 outline-none"></div>
      </div>
      <div class="border border-border-medium rounded-xl overflow-hidden focus-within:border-primary focus-within:shadow-focus">
        <div class="flex"><label for="phone" class="bg-bg-secondary border-l border-border-light min-w-[110px] px-lg py-3.5 text-sm flex items-center">موبایل</label>
        <input id="phone" name="phone" required placeholder="09xxxxxxxxx" class="flex-1 px-lg py-3.5 outline-none"></div>
      </div>
      <label class="text-sm text-text-secondary">منبع اقلام</label>
      <div class="flex gap-lg text-sm">
        <label class="inline-flex items-center gap-2"><input type="radio" name="source" value="cart" checked class="accent-primary"> سبد خرید</label>
        <label class="inline-flex items-center gap-2"><input type="radio" name="source" value="compare" class="accent-primary"> لیست مقایسه</label>
      </div>
      <label for="note" class="text-sm text-text-secondary">توضیحات</label>
      <textarea id="note" name="note" rows="3" class="border border-border-medium rounded-xl px-lg py-3.5 outline-none focus:border-primary focus:shadow-focus"></textarea>
      <div id="rfq-preview" class="text-sm text-text-secondary bg-bg-secondary rounded-xl p-lg whitespace-pre-wrap font-mono dir-ltr text-left"></div>
      <button type="submit" class="bg-nav text-white px-xl py-md rounded-lg font-medium inline-flex items-center justify-center gap-2">
        <i class="fa-brands fa-whatsapp"></i> ارسال به واتساپ
      </button>
    </form>
  </main>
  <div id="site-footer"></div>
  <div id="site-bottom-nav"></div>
  <script src="js/app.js"></script>
  <script src="js/rfq.js"></script>
</body>
</html>
