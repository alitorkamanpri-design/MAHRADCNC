<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>برندها — MahradCNC</title>
  <link rel="icon" href="/MAHRADCNC/assets/icon-eyVgWEJK.png" type="image/png">
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/sahel-font@v3.4.0/dist/font-face.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" crossorigin href="/MAHRADCNC/assets/main-CeXhcROz.css">
</head>
<body class="bg-bg-secondary text-text-primary min-h-screen flex flex-col">
  <div id="site-header"></div>
  <main class="flex-1 max-w-7xl mx-auto w-full px-lg md:px-3xl py-4xl">
    <h1 class="text-3xl font-bold mb-md">برندهای فعال کاتالوگ</h1>
    <p class="text-sm text-text-secondary mb-3xl">برندها از داده محصولات به‌صورت پویا استخراج می‌شوند.</p>
    <div id="brands-grid" class="grid grid-cols-2 md:grid-cols-4 gap-lg"></div>
  </main>
  <div id="site-footer"></div>
  <div id="site-bottom-nav"></div>
  <script src="js/app.js"></script>
  <script>
    Mahrad.initShell({ page: 'home' });
    Mahrad.loadJSON('data/products.json').then((products) => {
      const brands = [...new Set(products.map((p) => p.brand).filter(Boolean))].sort();
      document.getElementById('brands-grid').innerHTML = brands.map((b) => `
        <a href="shop.html?q=${encodeURIComponent(b)}" class="bg-bg-primary border border-border-light rounded-xl p-2xl text-center shadow-sm hover:shadow-md transition-shadow">
          <p class="text-lg font-semibold text-nav">${Mahrad.escapeHtml(b)}</p>
          <p class="text-xs text-text-muted mt-sm">مشاهده در فروشگاه</p>
        </a>`).join('');
    });
  </script>
</body>
</html>
